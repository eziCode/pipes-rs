exit_when_nodes_finish: true
nodes:
  - id: camera
    path: /usr/local/bin/pipes-dora-benchmark
    args: camera
    outputs: [detections, camera_done]
    inputs:
      completion: fusion/completion
      credit: fusion/credit
  - id: lidar
    path: /usr/local/bin/pipes-dora-benchmark
    args: lidar
    outputs: [pointcloud, lidar_done]
    inputs:
      completion: fusion/completion
      credit: fusion/credit
  - id: fusion
    path: /usr/local/bin/pipes-dora-benchmark
    args: fusion
    outputs: [completion, credit]
    inputs:
      detections:
        source: camera/detections
        queue_size: 4
        queue_policy: backpressure
      pointcloud:
        source: lidar/pointcloud
        queue_size: 4
        queue_policy: backpressure
      camera_done:
        source: camera/camera_done
        queue_size: 1
        queue_policy: backpressure
      lidar_done:
        source: lidar/lidar_done
        queue_size: 1
        queue_policy: backpressure
