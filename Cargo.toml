[package]
name = "pipes-rs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Instrumented Apache Arrow sensor pipeline"

[dependencies]
anyhow = "1"
arrow = { version = "56", features = ["ipc"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ort = "=2.0.0-rc.13"
parquet = { version = "56", features = ["arrow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
